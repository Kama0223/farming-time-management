<div class="personel-information-wrapper-desktop">
  <div class="row align-items-start">
    <!-- Sol: Fotoğraf -->
    <div class="col-auto">
      <img class="staff-profile-picture" src="/assets/image/farmer-profile-picture.jpg" alt="Worker">
    </div>

    <!-- Sağ: Personel Detay -->
    <div class="col col-personel-detail">
      <h2 class="staff-title">Admin</h2>
      <p class="staff-text">Agricultural Worker</p>
      <p class="staff-text">peterparker@spiderman.com</p>
      <p class="staff-text">Adelaide, Australia</p>
      <p class="staff-text">01.01.2000</p>
    </div>
  </div>
</div>



    <div class="status-box">
      <div class="row">
        <div class="col">
          <div class="status-box-title">Status</div>
          <div class="status-box-text">Working</div>
        </div>
        <div class="col">
          <div class="status-box-title">Clock In</div>
          <div class="status-box-text">7:19 AM</div>
        </div>
        <div class="col">
          <div class="status-box-title">Duration</div>
          <div class="status-box-text">8h 13m</div>
        </div>
      </div>
    </div>

    <div class="clock-buttons">
      <button class="btn btn-success">Clock In</button>
      <button class="btn btn-danger">Clock Out</button>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
